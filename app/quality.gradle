apply plugin: 'checkstyle'

checkstyle {
    toolVersion = "6.15"
}

repositories {
    mavenCentral()
}

configurations {
    ktlint
}

dependencies {
    ktlint('com.pinterest:ktlint:0.45.2') {
        attributes {
            attribute(Bundling.BUNDLING_ATTRIBUTE, getObjects().named(Bundling, Bundling.EXTERNAL))
        }
    }
}

task ktlint(type: JavaExec, group: "verification") {
    def outputFile = "${buildDir}/reports/checkstyle/ktlint.xml"
    description = "Check Kotlin code style."
    classpath = configurations.ktlint
    mainClass.set("com.pinterest.ktlint.Main")
    args "src/**/*.kt"
    args "--reporter=plain", "--reporter=checkstyle,output="+outputFile
    jvmArgs "--add-opens", "java.base/java.lang=ALL-UNNAMED"
    ignoreExitValue true
    doLast {
        def exitValue = executionResult.get().exitValue
        if(exitValue == 0) {
            print "ktlint finished successfully"
        } else {
            throw new GradleException('Fix style for kotlin code, see report: ' + outputFile)
        }
    }
}

task axComplianceCheck {
    group = "verification"
    description = "Enforces Agent Experience (AX) architectural rules (file sizes, poka-yoke, actionable errors)."
    doLast {
        def violations = []
        def featuresDir = file("${projectDir}/src/main/java/com/kickstarter/features")
        def srcDir = file("${projectDir}/src/main/java")

        // Rule 4: Ban bare uncontextualized throw Exception() across the codebase
        srcDir.eachFileRecurse { f ->
            if (f.name.endsWith('.kt') || f.name.endsWith('.java')) {
                f.eachLine { line, lineNum ->
                    def trimmed = line.trim()
                    if (trimmed.contains("throw Exception(") && !trimmed.startsWith("//") && !trimmed.startsWith("*")) {
                        violations << "${f.path}:${lineNum} - Banned bare throw Exception() (Violates AX Rule 4; use RFC 9457 ProblemDetails or structured exceptions)"
                    }
                }
            }
        }

        // Rule 2: Dev-Primitives - Data & ViewModel files under features/ must not exceed 300 LOC
        if (featuresDir.exists()) {
            featuresDir.eachFileRecurse { f ->
                if (f.name.endsWith('.kt') && (f.path.contains('/data/') || f.path.contains('/viewmodel/'))) {
                    def lines = f.readLines().size()
                    if (lines > 300) {
                        violations << "${f.path} - Feature source file exceeds 300 LOC limit (${lines} lines). (Violates AX Rule 2 Dev-Primitives)"
                    }
                }
            }
        }

        // Rule 2: Component-Local Modularization - No cross-feature imports
        if (featuresDir.exists()) {
            featuresDir.listFiles().each { featureFolder ->
                if (featureFolder.isDirectory()) {
                    def featureName = featureFolder.name
                    featureFolder.eachFileRecurse { f ->
                        if (f.name.endsWith('.kt')) {
                            f.eachLine { line, lineNum ->
                                def trimmed = line.trim()
                                if (trimmed.startsWith("import com.kickstarter.features.")) {
                                    def parts = trimmed.substring("import com.kickstarter.features.".length()).split("\\.")
                                    if (parts.length > 0 && parts[0] != featureName) {
                                        violations << "${f.path}:${lineNum} - Cross-feature import '${trimmed}' in feature '${featureName}' (Violates AX Rule 2 Modularization)"
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        // Quality Gate: Feature ViewModel classes must not exceed 20 public methods per class
        if (featuresDir.exists()) {
            featuresDir.eachFileRecurse { f ->
                if (f.name.endsWith('.kt') && f.path.contains('/viewmodel/')) {
                    def publicMethods = f.readLines().findAll { line ->
                        def t = line.trim()
                        t.startsWith("fun ") && !t.startsWith("private ") && !t.startsWith("internal ")
                    }
                    if (publicMethods.size() > 20) {
                        violations << "${f.path} - ViewModel class has ${publicMethods.size()} public methods (Exceeds AX Quality Gate limit of max 20 public methods per class)"
                    }
                }
            }
        }

        if (!violations.isEmpty()) {
            def errorMsg = "AX Architectural Compliance Check FAILED with ${violations.size()} violation(s):\n" + violations.join("\n")
            throw new GradleException(errorMsg)
        } else {
            println "AX Architectural Compliance Check PASSED successfully. All rules enforced."
        }
    }
}

check.dependsOn 'checkstyle','ktlint','axComplianceCheck'

task ktlintFormat(type: JavaExec, group: "formatting") {
    description = "Fix Kotlin code style deviations."
    classpath = configurations.ktlint
    jvmArgs "--add-opens", "java.base/java.lang=ALL-UNNAMED"
    mainClass.set("com.pinterest.ktlint.Main")
    args "-F", "src/**/*.kt"
    ignoreExitValue true
}

task checkstyle(type: Checkstyle) {
    configFile file("${project.rootDir}/script/style/checkstyle.xml")
    source 'src'
    include '**/*.java'
    exclude '**/gen/**'

    classpath = files()
}
